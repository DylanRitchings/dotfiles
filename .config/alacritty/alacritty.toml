[terminal.shell]
program = "/bin/zsh"

[keyboard]
bindings = [
  { key = "Escape", mods="Super",  action = "ToggleViMode" }, #mode="~Vi",
  { key = "c", mods="Alt", action = "Copy" },
  { key = "v", mods="Alt", action = "Paste" },
]

[window]
opacity = 0.7
decorations = "buttonless"  # Changed from "none" to allow window manager tiling
resize_increments = false

[font]
normal={family = "FiraCode Nerd Font"}
size = 14.5

[terminal]
